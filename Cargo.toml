[workspace]
resolver = "3"
members = ["crates/pihome-ui", "crates/pihome-rotator", "apps/pihole-tui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
pihome-ui = { path = "crates/pihome-ui" }
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
wiremock = "0.6"
insta = "1"

[profile.release]
strip = true
lto = "thin"
