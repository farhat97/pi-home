# tmux config for the pi-home display session (/etc/pihome/tmux.conf).
# The display is passive: no status bar, no messages, no bells.

set -g status off
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -g mouse off
set -g history-limit 200

# The rotator selects windows by name, so names must never change.
set -g allow-rename off
setw -g automatic-rename off
set -g base-index 0

# Size windows to the smallest attached client, so attaching over SSH from a
# bigger terminal doesn't resize what the 3.5" display shows.
setw -g window-size smallest
setw -g aggressive-resize on

# No visual noise.
set -g bell-action none
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off
setw -g monitor-activity off
set -g display-time 1
set -g set-titles off
set -g lock-after-time 0
set -g destroy-unattached off
